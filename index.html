<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>THE THRONE VIP - REAL WOOD ⚔️</title>
    <style>
        :root {
            --neon-orange: #ff6600;
            --wood-gradient: linear-gradient(145deg, #5d4037, #2d1d1a);
            --inner-shadow: inset 2px 2px 5px rgba(255,255,255,0.1), inset -2px -2px 5px rgba(0,0,0,0.5);
        }

        body {
            background-color: #050505; color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; overflow: hidden; display: flex; justify-content: center;
        }

        /* شريط النيون البرتقالي */
        .neon-line {
            position: absolute; top: 0; width: 100%; height: 5px;
            background: var(--neon-orange); box-shadow: 0 0 20px var(--neon-orange);
            z-index: 1000;
        }

        .main-frame {
            width: 100%; max-width: 400px; height: 100vh;
            background: #111; display: flex; flex-direction: column; position: relative;
        }

        /* شاشة الدخول */
        .overlay {
            position: absolute; inset: 0; background: #000; z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }

        /* منطقة اللعب - 10 صفوف */
        .scroll-area {
            flex: 1; overflow-y: auto; padding: 20px 20px 100px 20px;
            display: flex; flex-direction: column-reverse; gap: 12px;
        }

        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; opacity: 0.2; pointer-events: none; transition: 0.4s; }
        .row.active { opacity: 1; pointer-events: auto; transform: scale(1.02); }

        /* الخشب الـ 3D */
        .tile {
            height: 65px; background: var(--wood-gradient); border-radius: 8px;
            box-shadow: 0 4px 0 #1a0f0d, 0 8px 15px rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center;
            font-size: 2rem; cursor: pointer; position: relative; transition: 0.2s;
        }
        .tile:active { transform: translateY(4px); box-shadow: 0 0 0 #1a0f0d; }

        .tile.win { background: #000 !important; box-shadow: inset 0 0 15px #e74c3c; border: 1px solid #e74c3c; }
        .tile.win::after { content: '🍷'; filter: drop-shadow(0 0 5px red); }

        .tile.lose { background: #000 !important; box-shadow: inset 0 0 15px #8e44ad; border: 1px solid #8e44ad; }
        .tile.lose::after { content: '🧪'; filter: drop-shadow(0 0 5px purple); }

        /* الأزرار والشات */
        .footer { padding: 15px; background: #000; border-top: 2px solid var(--neon-orange); text-align: center; }
        .btn-new {
            background: #000; color: var(--neon-orange); border: 2px solid var(--neon-orange);
            padding: 10px 30px; border-radius: 5px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 10px rgba(255,102,0,0.3);
        }

        #ghost-chat {
            position: absolute; right: 5px; top: 150px; width: 70px; font-size: 8px;
            color: #0f0; font-family: monospace; pointer-events: none; opacity: 0.6;
        }

        input {
            width: 80%; padding: 12px; margin: 10px; background: #000; border: 1px solid var(--neon-orange);
            color: white; text-align: center; border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="neon-line"></div>

    <div class="main-frame">
        <div id="ghost-chat"></div>

        <!-- شاشة الباسورد والـ ID -->
        <div id="gate" class="overlay">
            <h2 style="color:var(--neon-orange)">THE THRONE HACK</h2>
            <input type="password" id="p_pass" placeholder="PASSWORD">
            <input type="text" id="p_id" placeholder="PLAYER ID">
            <button class="btn-new" onclick="unlock()">ACCESS SYSTEM</button>
        </div>

        <div style="padding:10px; font-size:10px; color:var(--neon-orange); display:flex; justify-content:space-between; background:#000;">
            <span id="user_display">ID: --------</span>
            <span>STATUS: BYPASS_ACTIVE</span>
        </div>

        <div id="grid-container" class="scroll-area"></div>

        <div class="footer">
            <button class="btn-new" onclick="initGame()">NEW GAME 🔄</button>
        </div>
    </div>

    <audio id="bg-music" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" type="audio/mpeg"></audio>

    <script>
        let currentLevel = 0;
        let bombMap = [];

        function unlock() {
            if(document.getElementById('p_pass').value === "102075" && document.getElementById('p_id').value === "13551996") {
                document.getElementById('gate').style.display = 'none';
                document.getElementById('user_display').innerText = "ID: 13551996";
                document.getElementById('bg-music').play();
                initGame();
                startGhost();
            } else { alert("ACCESS DENIED"); }
        }

        function initGame() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            currentLevel = 0;
            bombMap = [];

            for(let i=0; i<10; i++) {
                const row = document.createElement('div');
                row.className = 'row' + (i === 0 ? ' active' : '');
                row.id = `row-${i}`;

                // قواعد الصعوبة المطلوبة:
                let bombCount = (i < 4) ? 1 : (i < 7) ? 2 : (i < 9) ? 3 : 4;
                let bombs = [];
                while(bombs.length < bombCount) {
                    let r = Math.floor(Math.random() * 5);
                    if(!bombs.includes(r)) bombs.push(r);
                }
                bombMap.push(bombs);

                for(let j=0; j<5; j++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.onclick = () => playMove(i, j);
                    row.appendChild(tile);
                }
                container.appendChild(row);
            }
        }

        function playMove(r, c) {
            if(r !== currentLevel) return;
            const tile = document.getElementById(`row-${r}`).children[c];

            if(bombMap[r].includes(c)) {
                tile.classList.add('lose');
                // لا يخرج من اللعبة، يظل في نفس الدور
            } else {
                tile.classList.add('win');
                setTimeout(() => {
                    if(currentLevel < 9) {
                        document.getElementById(`row-${currentLevel}`).classList.remove('active');
                        currentLevel++;
                        document.getElementById(`row-${currentLevel}`).classList.add('active');
                        document.getElementById('grid-container').scrollBy({top: -85, behavior: 'smooth'});
                    } else {
                        alert("👑 THE THRONE IS YOURS!");
                    }
                }, 400);
            }
        }

        function startGhost() {
            const chat = document.getElementById('ghost-chat');
            const msgs = ["INIT..", "0x88F", "BYPASS", "DECRYPT", "VOID", "ROOT"];
            setInterval(() => {
                const m = document.createElement('div');
                m.innerText = msgs[Math.floor(Math.random()*msgs.length)] + "_" + Math.random().toString(36).slice(2,4);
                chat.appendChild(m);
                if(chat.childNodes.length > 10) chat.removeChild(chat.firstChild);
            }, 1000);
        }
    </script>
</body>
</html>
