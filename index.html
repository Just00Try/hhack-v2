<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HHACK V2 - Pro Edition</title>
    <style>
        :root {
            --primary-orange: #ff6600;
            --dark-wood: #3d1f05;
            --light-wood: #8b5a2b;
        }

        body {
            background-color: #0a0a0a;
            color: var(--primary-orange);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            height: 100vh;
        }

        /* Header UI */
        .header {
            width: 100%;
            padding: 10px;
            background: linear-gradient(to bottom, #1a0f00, #000);
            border-bottom: 2px solid var(--primary-orange);
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.3);
        }

        /* Game Container */
        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }

        /* 3D Wood Tiles */
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
        }

        .tile {
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, var(--light-wood), var(--dark-wood));
            border-radius: 8px;
            box-shadow: 5px 5px 10px #000, -2px -2px 5px rgba(255,255,255,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            position: relative;
        }

        .tile:active {
            transform: translateZ(-10px) scale(0.95);
            box-shadow: inset 2px 2px 5px #000;
        }

        /* Controls */
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }

        button {
            background: black;
            color: var(--primary-orange);
            border: 2px solid var(--primary-orange);
            padding: 12px 25px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.2);
            border-radius: 5px;
        }

        button:hover {
            background: var(--primary-orange);
            color: black;
            box-shadow: 0 0 20px var(--primary-orange);
        }

        /* Terminal Text */
        #terminal {
            width: 80%;
            height: 100px;
            background: rgba(0,0,0,0.8);
            border-left: 3px solid var(--primary-orange);
            margin-top: 20px;
            padding: 10px;
            font-size: 10px;
            color: #00ff00;
            overflow-y: hidden;
        }

        /* Login Screen */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        input {
            background: #111;
            border: 1px solid var(--primary-orange);
            color: white;
            padding: 10px;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="header">
    <span>ID: 13551996</span>
    <span>$:~ROOT@THRONE_SERVER</span>
</div>

<div id="login-screen">
    <h1 style="text-shadow: 0 0 10px var(--primary-orange);">SYSTEM ACCESS</h1>
    <input type="text" id="access-code" placeholder="ENTER ACCESS CODE">
    <button onclick="startGame()">CONNECT</button>
</div>

<div id="game-container">
    <div class="controls">
        <button onclick="resetGame()">NEW GAME</button>
    </div>

    <div class="grid" id="grid">
        <!-- Tiles will be generated here -->
    </div>

    <div id="terminal">
        > INITIALIZING BYPASS...<br>
        > WAITING FOR UPLINK...
    </div>
</div>

<!-- Audio for hacker vibes -->
<audio id="bg-music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
    const code = "1234"; // كود الدخول
    const music = document.getElementById('bg-music');

    function startGame() {
        const input = document.getElementById('access-code').value;
        if(input === code) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            generateGrid();
            music.play();
            updateTerminal("ACCESS GRANTED. WELCOME OPERATOR.");
        } else {
            alert("WRONG CODE!");
        }
    }

    function generateGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        for (let i = 0; i < 25; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.onclick = () => {
                tile.style.background = 'linear-gradient(145deg, #00ff00, #004400)';
                tile.style.boxShadow = '0 0 15px #00ff00';
                updateTerminal("DATA PACKET " + Math.random().toString(16).slice(2,8) + " EXTRACTED.");
            };
            grid.appendChild(tile);
        }
    }

    function resetGame() {
        generateGrid();
        updateTerminal("SYSTEM REBOOTED. STARTING NEW SESSION.");
    }

    function updateTerminal(text) {
        const term = document.getElementById('terminal');
        term.innerHTML += `<br>> ${text}`;
        term.scrollTop = term.scrollHeight;
    }
</script>

</body>
</html>
