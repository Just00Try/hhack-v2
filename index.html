<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>THE THRONE VIP - ULTIMATE</title>
    <style>
        :root { 
            --gold: #ffd700; 
            --blue: #00d4ff; 
            --neon: 0 0 15px rgba(255, 215, 0, 0.7); 
            --win-green: #2ecc71;
            --wood-gradient: linear-gradient(145deg, #4a332c, #1f1412);
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; } 
        body { margin: 0; background: #000; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .status-bar { position: absolute; top: 0; width: 100%; background: rgba(0, 212, 255, 0.1); border-bottom: 1px solid var(--blue); padding: 5px 0; overflow: hidden; white-space: nowrap; z-index: 10; }
        .status-text { display: inline-block; animation: scrollText 15s linear infinite; color: var(--blue); font-size: 11px; font-weight: bold; }
        @keyframes scrollText { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        .container { background: rgba(0, 10, 25, 0.98); border: 2px solid var(--gold); padding: 25px 20px; border-radius: 25px; text-align: center; width: 340px; box-shadow: var(--neon); position: relative; backdrop-filter: blur(10px); }
        .neon-line { position: absolute; top: -2px; left: 50%; transform: translateX(-50%); width: 120px; height: 4px; background: var(--gold); box-shadow: 0 0 15px var(--gold); border-radius: 10px; }
        .title { font-size: 22px; color: var(--gold); margin-bottom: 20px; font-weight: 900; text-shadow: 0 0 15px var(--gold); }
        
        .btn-3d { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.2s; text-transform: uppercase; }
        .btn-gold { background: linear-gradient(145deg, #ffd700, #b8860b); color: #000; box-shadow: 0 4px 0 #8a6d00; }
        .btn-gold:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a6d00; }
        .btn-blue { background: transparent; color: var(--blue); border: 1px solid var(--blue); box-shadow: 0 0 10px rgba(0, 212, 255, 0.3); }
        .btn-blue:active { transform: scale(0.98); }
        
        input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #1a3a5a; background: #000; color: var(--blue); text-align: center; font-size: 16px; outline: none; }
        
        .scroll-area {
            max-height: 280px; overflow-y: auto; padding: 5px;
            display: flex; flex-direction: column-reverse; gap: 8px;
            background: rgba(0,0,0,0.6); border-radius: 15px; margin-top: 10px; border: 1px solid #1a3a5a;
        }
        .scroll-area::-webkit-scrollbar { width: 4px; }
        .scroll-area::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; opacity: 0.2; pointer-events: none; transition: 0.3s; }
        .row.active { opacity: 1; pointer-events: auto; }

        .tile {
            height: 42px; background: var(--wood-gradient); border-radius: 6px;
            box-shadow: 0 3px 0 #120907, 0 4px 8px rgba(0,0,0,0.6);
            display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; cursor: pointer; position: relative; transition: 0.1s;
        }
        .tile:active { transform: translateY(2px); box-shadow: 0 1px 0 #120907; }

        .tile.win { background: #000 !important; box-shadow: inset 0 0 10px #e74c3c; border: 1px solid #e74c3c; }
        .tile.win::after { content: '🍷'; filter: drop-shadow(0 0 3px red); }

        .tile.lose { background: #000 !important; box-shadow: inset 0 0 10px #8e44ad; border: 1px solid #8e44ad; }
        .tile.lose::after { content: '🧪'; filter: drop-shadow(0 0 3px purple); }

        .loader-box { background: #000000 !important; border: 2px solid var(--blue) !important; box-shadow: 0 0 20px rgba(0, 212, 255, 0.5) !important; }
        .spin-circle { width: 50px; height: 50px; border: 5px solid #111; border-top: 5px solid var(--blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .progress-bar { width: 100%; height: 4px; background: #111; border-radius: 2px; margin-top: 15px; position: relative; overflow: hidden; }
        .progress-line { position: absolute; height: 100%; width: 40%; background: var(--blue); animation: loadMove 2s infinite linear; }
        @keyframes loadMove { from { left: -40%; } to { left: 100%; } }

        .hidden { display: none !important; }
        #music-ctrl { position: absolute; bottom: 15px; right: 15px; background: none; border: 1px solid var(--gold); color: var(--gold); border-radius: 50%; width: 35px; height: 35px; cursor: pointer; z-index: 20; font-size: 12px; }
        
        #ghost-chat { position: absolute; left: 10px; bottom: 15px; font-size: 8px; color: #0f0; font-family: monospace; pointer-events: none; opacity: 0.5; text-align: left; }
    </style>
</head>
<body>

    <audio id="bg-music" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg"></audio>
    <audio id="click-sound"><source src="https://www.myinstants.com/media/sounds/button-3.mp3" type="audio/mpeg"></audio>

    <button id="music-ctrl" onclick="toggleMusic()">🔊</button>
    <div id="ghost-chat"></div>

    <div class="status-bar">
        <div class="status-text">SYSTEM ONLINE... SCANNING THRONE MATRIX... BYPASS_ACTIVE... AI SYSTEM READY...</div>
    </div>

    <div id="screen-pass" class="container">
        <div class="neon-line"></div>
        <div class="title">SECURE LOGIN</div>
        <input type="password" id="mainKey" placeholder="PASSWORD">
        <button class="btn-3d btn-gold" onclick="login()">UNLOCK SYSTEM</button>
    </div>

    <div id="screen-choice" class="container hidden">
        <div class="neon-line"></div>
        <div class="title">SELECT SYSTEM</div>
        <button class="btn-3d btn-gold" onclick="playClick(); showID()">FREE TRIAL</button>
        <button class="btn-3d btn-blue" style="border-color: #f00; color: #f00; box-shadow: 0 0 10px rgba(255,0,0,0.2);" onclick="playClick(); vipAccess()">VIP PRO ACCESS</button>
    </div>

    <div id="screen-id" class="container hidden">
        <div class="neon-line"></div>
        <div class="title">VERIFY PLAYER ID</div>
        <input type="text" id="pID" placeholder="PLAYER ID">
        <button class="btn-3d btn-gold" onclick="playClick(); checkID()">CONNECT SERVER</button>
    </div>

    <div id="screen-loading" class="container loader-box hidden">
        <div class="spin-circle"></div>
        <div id="load-text" style="font-family: monospace; font-size: 14px; color: #fff; font-weight: bold; letter-spacing: 1px;">يتم الاتصال بخادم اللعبة...</div>
        <div class="progress-bar"><div class="progress-line"></div></div>
    </div>

    <div id="screen-game" class="container hidden">
        <div class="neon-line"></div>
        <div class="title" id="game-title">THRONE RADAR</div>
        
        <div style="font-size: 11px; color: var(--blue); display: flex; justify-content: space-between; margin-bottom: 5px; padding: 0 5px;">
            <span id="user_display">ID: --------</span>
            <span>STATUS: BYPASS_ACTIVE</span>
        </div>

        <div id="grid-container" class="scroll-area"></div>

        <div style="margin-top: 15px;">
            <button class="btn-3d btn-gold" onclick="playClick(); initGame()">NEW GAME 🔄</button>
        </div>
    </div>

    <script>
        const allowedIDs = ["13551996", "1002075", "1677182779", "20040050", "1679159755", "1679287881", "1680177899", "1680245567", "1680318023"];
        const music = document.getElementById('bg-music');
        const clickSnd = document.getElementById('click-sound');
        
        let currentLevel = 0;
        let bombMap = [];

        function playClick() { 
            try { clickSnd.play(); } catch(e) { console.log("Audio play deferred"); }
        }

        function toggleMusic() {
            if (music.paused) { music.play(); document.getElementById('music-ctrl').innerText = "🔊"; }
            else { music.pause(); document.getElementById('music-ctrl').innerText = "🔈"; }
        }

        function hideAll() { document.querySelectorAll('.container').forEach(c => c.classList.add('hidden')); }

        // تفعيل زر Enter للدخول السريع من الكيبورد
        document.getElementById('mainKey').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { login(); }
        });

        function login() {
            playClick();
            const enteredPass = document.getElementById('mainKey').value.trim();
            
            if (enteredPass === "15711") {
                try { music.play(); } catch(e) { console.log("Music auto-play blocked"); }
                hideAll(); 
                document.getElementById('screen-choice').classList.remove('hidden');
                startGhost();
            } else { 
                alert("WRONG KEY! PLEASE TRY AGAIN"); 
            }
        }

        function showID() { hideAll(); document.getElementById('screen-id').classList.remove('hidden'); }
        
        function vipAccess() {
            let p = prompt("VIP ACCESS KEY:");
            if (p && p.trim() === "102545") {
                hideAll(); 
                document.getElementById('screen-game').classList.remove('hidden');
                document.getElementById('game-title').innerText = "THRONE VIP RADAR";
                document.getElementById('user_display').innerText = "ID: VIP_USER";
                initGame();
            } else { alert("ACCESS DENIED!"); }
        }

        function checkID() {
            const typedID = document.getElementById('pID').value.trim();
            if (allowedIDs.includes(typedID)) {
                hideAll(); 
                const loadingScreen = document.getElementById('screen-loading');
                const loadText = document.getElementById('load-text');
                loadingScreen.classList.remove('hidden');
                
                setTimeout(() => { 
                    loadText.innerText = "جاري فحص بروتوكول الحماية..."; 
                    loadText.style.color = "var(--blue)";
                }, 1300);
                
                setTimeout(() => { 
                    loadText.innerText = "تم اختراق المنظومة.. جاري فتح الرادار"; 
                    loadText.style.color = "var(--win-green)";
                }, 2600);

                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    document.getElementById('screen-game').classList.remove('hidden');
                    document.getElementById('user_display').innerText = "ID: " + typedID;
                    initGame();
                }, 4000);

            } else { alert("ID NOT REGISTERED!"); }
        }

        function initGame() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            currentLevel = 0;
            bombMap = [];

            for (let i = 0; i < 10; i++) {
                const row = document.createElement('div');
                row.className = 'row' + (i === 0 ? ' active' : '');
                row.id = `row-${i}`;

                let bombCount = (i < 4) ? 1 : (i < 7) ? 2 : (i < 9) ? 3 : 4;
                let bombs = [];
                while (bombs.length < bombCount) {
                    let r = Math.floor(Math.random() * 5);
                    if (!bombs.includes(r)) bombs.push(r);
                }
                bombMap.push(bombs);

                for (let j = 0; j < 5; j++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.onclick = () => playMove(i, j);
                    row.appendChild(tile);
                }
                container.appendChild(row);
            }
            container.scrollTop = container.scrollHeight;
        }

        function playMove(r, c) {
            if (r !== currentLevel) return;
            const tile = document.getElementById(`row-${r}`).children[c];
            playClick();

            if (bombMap[r].includes(c)) {
                tile.classList.add('lose');
            } else {
                tile.classList.add('win');
                setTimeout(() => {
                    if (currentLevel < 9) {
                        document.getElementById(`row-${currentLevel}`).classList.remove('active');
                        currentLevel++;
                        document.getElementById(`row-${currentLevel}`).classList.add('active');
                        document.getElementById('grid-container').scrollBy({top: -50, behavior: 'smooth'});
                    } else {
                        alert("👑 THE THRONE IS YOURS!");
                    }
                }, 300);
            }
        }

        function startGhost() {
            const chat = document.getElementById('ghost-chat');
            const msgs = ["CONNECT..", "0x99A", "BYPASS", "DECRYPT", "THRONE_IN", "ROOT_OK"];
            setInterval(() => {
                if (document.getElementById('screen-pass').classList.contains('hidden')) {
                    const m = document.createElement('div');
                    m.innerText = msgs[Math.floor(Math.random()*msgs.length)] + "_" + Math.random().toString(36).slice(2,4).toUpperCase();
                    chat.appendChild(m);
                    if (chat.childNodes.length > 5) chat.removeChild(chat.firstChild);
                }
            }, 1200);
        }
    </script>
</body>
</html>
