<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>THE THRONE - CYBER VIP EVO</title>
    <style>
        :root { 
            --cyber-purple: #bc13fe;
            --matrix-green: #00ff66;
            --neon-glow: 0 0 20px rgba(188, 19, 254, 0.6);
            --cyber-red: #ff0055;
            --dark-tile: linear-gradient(145deg, #150926, #05020a);
        }
        * { box-sizing: border-box; font-family: 'Consolas', 'Segoe UI', monospace; } 
        body { margin: 0; background: #020105; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        /* شريط الحالة العلوي المستقبلي */
        .status-bar { position: absolute; top: 0; width: 100%; background: rgba(188, 19, 254, 0.08); border-bottom: 2px solid var(--cyber-purple); padding: 6px 0; overflow: hidden; white-space: nowrap; z-index: 10; box-shadow: 0 0 10px rgba(188, 19, 254, 0.3); }
        .status-text { display: inline-block; animation: scrollText 12s linear infinite; color: var(--matrix-green); font-size: 11px; font-weight: bold; letter-spacing: 1px; }
        @keyframes scrollText { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        /* الحاوية الرئيسية بتصميم هجومي */
        .container { background: rgba(8, 4, 15, 0.96); border: 2px solid var(--cyber-purple); padding: 30px 22px; border-radius: 20px; text-align: center; width: 340px; box-shadow: var(--neon-glow); position: relative; backdrop-filter: blur(15px); }
        .neon-line { position: absolute; top: -2px; left: 50%; transform: translateX(-50%); width: 150px; height: 4px; background: var(--matrix-green); box-shadow: 0 0 15px var(--matrix-green); border-radius: 10px; }
        .title { font-size: 24px; color: #fff; margin-bottom: 25px; font-weight: 900; text-shadow: 0 0 10px var(--cyber-purple); letter-spacing: 2px; }
        
        /* أزرار 3D مطورة كلياً */
        .btn-3d { width: 100%; padding: 14px; margin: 10px 0; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.15s; text-transform: uppercase; letter-spacing: 1px; }
        
        .btn-purple { background: linear-gradient(145deg, #bc13fe, #7a06a9); color: #fff; box-shadow: 0 5px 0 #4f036e, 0 5px 15px rgba(188, 19, 254, 0.4); text-shadow: 0 1px 2px black; }
        .btn-purple:active { transform: translateY(4px); box-shadow: 0 1px 0 #4f036e; }
        
        .btn-cyber-red { background: transparent; color: var(--cyber-red); border: 2px solid var(--cyber-red); box-shadow: 0 0 12px rgba(255, 0, 85, 0.3); font-weight: 900; }
        .btn-cyber-red:hover { background: var(--cyber-red); color: #000; box-shadow: 0 0 20px var(--cyber-red); }
        .btn-cyber-red:active { transform: scale(0.97); }
        
        input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 10px; border: 1px solid var(--cyber-purple); background: #000; color: var(--matrix-green); text-align: center; font-size: 16px; outline: none; box-shadow: inset 0 0 8px rgba(188, 19, 254, 0.2); font-family: monospace; }
        input:focus { border-color: var(--matrix-green); box-shadow: inset 0 0 8px rgba(0, 255, 102, 0.2), 0 0 10px rgba(0, 255, 102, 0.2); }
        
        /* منطقة اللعب الرقمية */
        .scroll-area {
            max-height: 290px; overflow-y: auto; padding: 8px;
            display: flex; flex-direction: column-reverse; gap: 8px;
            background: rgba(0, 0, 0, 0.8); border-radius: 12px; margin-top: 10px; border: 1px solid rgba(188, 19, 254, 0.3);
        }
        .scroll-area::-webkit-scrollbar { width: 4px; }
        .scroll-area::-webkit-scrollbar-thumb { background: var(--cyber-purple); border-radius: 10px; }

        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; opacity: 0.15; pointer-events: none; transition: 0.3s; }
        .row.active { opacity: 1; pointer-events: auto; transform: scale(1.01); }

        /* بلاطات السايبر المتوهجة */
        .tile {
            height: 44px; background: var(--dark-tile); border-radius: 6px; border: 1px solid rgba(188, 19, 254, 0.4);
            box-shadow: 0 3px 0 #0b0314, 0 4px 10px rgba(0,0,0,0.7);
            display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; cursor: pointer; position: relative; transition: 0.1s;
        }
        .tile:active { transform: translateY(2px); box-shadow: 0 1px 0 #0b0314; }

        /* تغيير ألوان الفوز والخسارة لتصبح تكنولوجية مبهرة */
        .tile.win { background: #000 !important; box-shadow: inset 0 0 12px var(--matrix-green); border: 2px solid var(--matrix-green); }
        .tile.win::after { content: '🟢'; filter: drop-shadow(0 0 5px var(--matrix-green)); }

        .tile.lose { background: #000 !important; box-shadow: inset 0 0 12px var(--cyber-red); border: 2px solid var(--cyber-red); }
        .tile.lose::after { content: '❌'; filter: drop-shadow(0 0 5px var(--cyber-red)); }

        /* شاشة التحميل النيون */
        .loader-box { background: #040208 !important; border: 2px solid var(--cyber-purple) !important; box-shadow: 0 0 25px rgba(188, 19, 254, 0.5) !important; }
        .spin-circle { width: 50px; height: 50px; border: 4px solid #11081c; border-top: 4px solid var(--cyber-purple); border-bottom: 4px solid var(--matrix-green); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .progress-bar { width: 100%; height: 4px; background: #11081c; border-radius: 2px; margin-top: 15px; position: relative; overflow: hidden; }
        .progress-line { position: absolute; height: 100%; width: 50%; background: linear-gradient(90deg, var(--cyber-purple), var(--matrix-green)); animation: loadMove 1.5s infinite linear; }
        @keyframes loadMove { from { left: -50%; } to { left: 100%; } }

        .hidden { display: none !important; }
        #music-ctrl { position: absolute; bottom: 15px; right: 15px; background: none; border: 1px solid var(--cyber-purple); color: var(--cyber-purple); border-radius: 50%; width: 38px; height: 38px; cursor: pointer; z-index: 20; font-size: 14px; box-shadow: 0 0 8px rgba(188, 19, 254, 0.3); }
        
        #ghost-chat { position: absolute; left: 15px; bottom: 15px; font-size: 9px; color: var(--matrix-green); font-family: monospace; pointer-events: none; opacity: 0.6; text-align: left; line-height: 1.3; }
    </style>
</head>
<body>

    <audio id="bg-music" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" type="audio/mpeg"></audio>
    <audio id="click-sound"><source src="https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav" type="audio/mpeg"></audio>

    <button id="music-ctrl" onclick="toggleMusic()">🔊</button>
    <div id="ghost-chat"></div>

    <div class="status-bar">
        <div class="status-text">[CYBER_EXTRACTOR_V4] // PORT_OPEN // ROOT_ACCESS_GRANTED // DECRYPTING TARGET AREA...</div>
    </div>

    <div id="screen-pass" class="container">
        <div class="neon-line"></div>
        <div class="title">CYBER LOGIN</div>
        <input type="password" id="mainKey" placeholder="ENTER ACCESS KEY">
        <button class="btn-3d btn-purple" onclick="login()">INITIALIZE BYPASS</button>
    </div>

    <div id="screen-choice" class="container hidden">
        <div class="neon-line"></div>
        <div class="title">INJECTION MODE</div>
        <button class="btn-3d btn-purple" onclick="playClick(); showID()">STANDALONE TRIAL</button>
        <button class="btn-3d btn-cyber-red" onclick="playClick(); vipAccess()">ULTIMATE VIP PRO</button>
    </div>

    <div id="screen-id" class="container hidden">
        <div class="neon-line"></div>
        <div class="title">TARGET INJECT</div>
        <input type="text" id="pID" placeholder="PLAYER ID">
        <button class="btn-3d btn-purple" onclick="playClick(); checkID()">EXECUTE EXPLOIT</button>
    </div>

    <div id="screen-loading" class="container loader-box hidden">
        <div class="spin-circle"></div>
        <div id="load-text" style="font-family: monospace; font-size: 13px; color: #fff; font-weight: bold; letter-spacing: 1px;">سحب توكن الحماية...</div>
        <div class="progress-bar"><div class="progress-line"></div></div>
    </div>

    <div id="screen-game" class="container hidden">
        <div class="neon-line"></div>
        <div class="title" id="game-title">CYBER RADAR</div>
        
        <div style="font-size: 11px; color: var(--matrix-green); display: flex; justify-content: space-between; margin-bottom: 8px; padding: 0 5px; font-weight: bold;">
            <span id="user_display">TARGET: --------</span>
            <span>OVERRIDE: OK</span>
        </div>

        <div id="grid-container" class="scroll-area"></div>

        <div style="margin-top: 15px;">
            <button class="btn-3d btn-purple" onclick="playClick(); initGame()">RESET RADAR 🔄</button>
        </div>
    </div>

    <script>
        const allowedIDs = ["13551996", "1002075", "1677182779", "20040050", "1679159755", "1679287881", "1680177899", "1680245567", "1680318023"];
        const music = document.getElementById('bg-music');
        const clickSnd = document.getElementById('click-sound');
        
        let currentLevel = 0;
        let bombMap = [];

        function playClick() { 
            try { clickSnd.currentTime = 0; clickSnd.play(); } catch(e) {}
        }

        function toggleMusic() {
            if (music.paused) { music.play(); document.getElementById('music-ctrl').innerText = "🔊"; }
            else { music.pause(); document.getElementById('music-ctrl').innerText = "🔈"; }
        }

        function hideAll() { document.querySelectorAll('.container').forEach(c => c.classList.add('hidden')); }

        document.getElementById('mainKey').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { login(); }
        });

        function login() {
            playClick();
            const enteredPass = document.getElementById('mainKey').value.trim();
            
            if (enteredPass === "15711") {
                try { music.play(); } catch(e) {}
                hideAll(); 
                document.getElementById('screen-choice').classList.remove('hidden');
                startGhost();
            } else { 
                alert("ACCESS VIOLATION: INVALID KEY"); 
            }
        }

        function showID() { hideAll(); document.getElementById('screen-id').classList.remove('hidden'); }
        
        function vipAccess() {
            let p = prompt("ENTER VIP FIRMWARE KEY:");
            if (p && p.trim() === "102545") {
                hideAll(); 
                document.getElementById('screen-game').classList.remove('hidden');
                document.getElementById('game-title').innerText = "VIP MATRIX RADAR";
                document.getElementById('user_display').innerText = "TARGET: VIP_USER";
                initGame();
            } else { alert("CRITICAL ERROR: ACCESS DENIED"); }
        }

        function checkID() {
            const typedID = document.getElementById('pID').value.trim();
            if (allowedIDs.includes(typedID)) {
                hideAll(); 
                const loadingScreen = document.getElementById('screen-loading');
                const loadText = document.getElementById('load-text');
                loadingScreen.classList.remove('hidden');
                
                setTimeout(() => { 
                    loadText.innerText = "تخطي جدار الحماية الخارجي..."; 
                    loadText.style.color = "var(--cyber-purple)";
                }, 1200);
                
                setTimeout(() => { 
                    loadText.innerText = "تم الحقن بنجاح! مزامنة البيانات..."; 
                    loadText.style.color = "var(--matrix-green)";
                }, 2500);

                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    document.getElementById('screen-game').classList.remove('hidden');
                    document.getElementById('user_display').innerText = "ID: " + typedID;
                    initGame();
                }, 3800);

            } else { alert("ERROR: PLAYER ID NOT FOUND IN MATRIX"); }
        }

        function initGame() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            currentLevel = 0;
            bombMap = [];

            for (let i = 0; i < 10; i++) {
                const row = document.createElement('div');
                row.className = 'row' + (i === 0 ? ' active' : '');
                row.id = `row-${i}`;

                let bombCount = (i < 4) ? 1 : (i < 7) ? 2 : (i < 9) ? 3 : 4;
                let bombs = [];
                while (bombs.length < bombCount) {
                    let r = Math.floor(Math.random() * 5);
                    if (!bombs.includes(r)) bombs.push(r);
                }
                bombMap.push(bombs);

                for (let j = 0; j < 5; j++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.onclick = () => playMove(i, j);
                    row.appendChild(tile);
                }
                container.appendChild(row);
            }
            container.scrollTop = container.scrollHeight;
        }

        function playMove(r, c) {
            if (r !== currentLevel) return;
            const tile = document.getElementById(`row-${r}`).children[c];
            playClick();

            if (bombMap[r].includes(c)) {
                tile.classList.add('lose');
            } else {
                tile.classList.add('win');
                setTimeout(() => {
                    if (currentLevel < 9) {
                        document.getElementById(`row-${currentLevel}`).classList.remove('active');
                        currentLevel++;
                        document.getElementById(`row-${currentLevel}`).classList.add('active');
                        document.getElementById('grid-container').scrollBy({top: -50, behavior: 'smooth'});
                    } else {
                        alert("⚡ SYSTEM CRACKED: THRONE OVERRIDDEN!");
                    }
                }, 2500);
            }
        }

        function startGhost() {
            const chat = document.getElementById('ghost-chat');
            const msgs = ["SYS_LOAD", "INJECT_0x9", "BYPASS_OK", "NET_SCAN", "TOKEN_VAL", "CYBER_CORE"];
            setInterval(() => {
                if (document.getElementById('screen-pass').classList.contains('hidden')) {
                    const m = document.createElement('div');
                    m.innerText = msgs[Math.floor(Math.random()*msgs.length)] + ">>" + Math.random().toString(36).slice(2,5).toUpperCase();
                    chat.appendChild(m);
                    if (chat.childNodes.length > 5) chat.removeChild(chat.firstChild);
                }
            }, 1000);
        }
    </script>
</body>
</html>
